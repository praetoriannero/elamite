[package]
name = "elamite"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Elamite programming language compiler"
license = "MIT"
publish = false

# The library crate keeps the language's name; the installed executable is
# `elamc`, in the tradition of `rustc`/`javac`.
[[bin]]
name = "elamc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
codespan-reporting = "0.13"
lasso = "0.7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
insta = "1"
proptest = "1"
